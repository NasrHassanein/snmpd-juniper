###############################################################################
# docker-compose.yml — Juniper SNMP Simulator
#
# Usage:
#   docker compose up -d
#   snmpget  -v2c -c public localhost:10161 sysDescr.0
#   snmpwalk -v2c -c public localhost:10161 .1.3.6.1.4.1.2636.3.1.13
###############################################################################

services:
  juniper-mx240-01:
    build: .
    container_name: juniper-mx240-01
    hostname: mx240-pe01
    ports:
      - "10161:161/udp"
    restart: unless-stopped

