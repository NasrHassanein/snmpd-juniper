###############################################################################
# snmpd.conf — Juniper JUNOS Router Simulation (MX240)
#
# This configuration makes the Linux snmpd agent respond to SNMP queries
# as if it were a Juniper MX240 running JUNOS 21.4R3.5.
#
# Juniper OID hierarchy:
#   enterprises.2636                = juniperMIB
#   enterprises.2636.1.1.1.2.29    = jnxProductNameMX240
#   enterprises.2636.3              = jnxMibs
#   enterprises.2636.3.1            = jnxBoxAnatomy (chassis MIB)
###############################################################################

# ─── Listening address ───────────────────────────────────────────────────────
agentAddress udp:161

# ─── Community strings ───────────────────────────────────────────────────────
rocommunity  public
# rocommunity6 public   # uncomment for IPv6

# ─── System identity overrides ───────────────────────────────────────────────
# sysDescr.0 — matches real Juniper JUNOS output format
override .1.3.6.1.2.1.1.1.0 octet_str "Juniper Networks, Inc. mx240 internet router, kernel JUNOS 21.4R3.5, Build date: 2023-03-15 02:30:01 UTC Copyright (c) 1996-2023 Juniper Networks, Inc."

# sysObjectID.0 — jnxProductNameMX240 = .1.3.6.1.4.1.2636.1.1.1.2.29
override .1.3.6.1.2.1.1.2.0 object_id .1.3.6.1.4.1.2636.1.1.1.2.29

# sysContact.0
override .1.3.6.1.2.1.1.4.0 octet_str "noc@example.com"

# sysName.0
override .1.3.6.1.2.1.1.5.0 octet_str "mx240-pe01.example.com"

# sysLocation.0
override .1.3.6.1.2.1.1.6.0 octet_str "DC2 Hall-A Row5 Rack22"

# sysServices.0 — 4 is typical for a Juniper router (L3 only)
override .1.3.6.1.2.1.1.7.0 integer 4

# ─── IF-MIB interface description overrides ──────────────────────────────────
# Make Linux interfaces look like Juniper interfaces.
# Index 1 = lo → lo0, Index 2 = eth0 → xe-0/0/0
override .1.3.6.1.2.1.2.2.1.2.1 octet_str "lo0"
override .1.3.6.1.2.1.2.2.1.2.2 octet_str "xe-0/0/0"
# ifAlias (ifXTable)
override .1.3.6.1.2.1.31.1.1.1.18.1 octet_str "lo0.0"
override .1.3.6.1.2.1.31.1.1.1.18.2 octet_str "Core uplink to P router"

# ─── pass_persist: Juniper proprietary OID subtrees ─────────────────────────
# Serves jnxBoxAnatomy, jnxOperatingTable, jnxFruTable, jnxAlarm, etc.
pass_persist .1.3.6.1.4.1.2636  /usr/local/bin/juniper_fake_agent.py

# Serves ENTITY-MIB entPhysicalTable (chassis/module/port inventory)
pass_persist .1.3.6.1.2.1.47    /usr/local/bin/juniper_fake_agent.py

# Serves HOST-RESOURCES-MIB hrSWInstalledTable (JUNOS version packages)
pass_persist .1.3.6.1.2.1.25    /usr/local/bin/juniper_fake_agent.py

# ─── Logging ─────────────────────────────────────────────────────────────────
[snmpd]
logOption f /dev/stderr
